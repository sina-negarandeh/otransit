[package]
name = "otransit"
version = "0.1.0"
edition = "2024"
description = "Live OC Transpo departures in the terminal"
repository = "https://github.com/sina-negarandeh/otransit"
# Personal project, not for crates.io. This also stops `cargo publish` working
# by accident, and means no `license` field is expected.
publish = false
# Floor implied by what we use: edition 2024 needs 1.85, and `is_multiple_of`
# on unsigned integers landed in 1.87. Not verified against older toolchains.
rust-version = "1.87"

[dependencies]
anyhow = "1"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
chrono-tz = "0.10"
directories = "5"
serde_json = "1"
ureq = "2"
zip = "2"

[dev-dependencies]
# Ingest reads real files, so its tests need a real directory to read from.
tempfile = "3"
# The terminal integration test drives the real binary through a pty: that is
# the only way to observe what we emit to a terminal, which TestBackend cannot.
portable-pty = "0.8"

# Standards enforced by the compiler rather than by convention. See RUST.md.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `clippy::all` is on by default and must stay at zero warnings.
#
# `pedantic` as a whole is not enabled: most of its findings here are
# `cast_possible_truncation` on deliberate, bounded casts in layout code, and
# silencing ~90 of those with `#[allow]` would train the eye to skip lint
# output. These are the pedantic lints that earn their keep.
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
unnested_or_patterns = "warn"
match_same_arms = "warn"
needless_raw_string_hashes = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"

[profile.release]
opt-level = 3
